spring.application.name=mercado-express-api

# Porta exigida pelo checkpoint: 8082.
# A variavel PORT so existe para o container do Render; localmente cai no default 8082.
server.port=${PORT:8082}

# ---------------------------------------------------------------
# Perfil default: Oracle da FIAP
# As credenciais NUNCA vao para o repositorio: use variaveis de ambiente
# (veja o arquivo .env.example na raiz do projeto).
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JSON mais legivel nos prints da entrega
spring.jackson.serialization.indent-output=true

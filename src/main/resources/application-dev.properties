# ---------------------------------------------------------------
# Perfil dev: H2 em memoria.
# Usado para testes locais rapidos e como fallback do deploy, caso o
# Oracle da FIAP recuse conexoes vindas de IP externo (Render).
# Ativar com: --spring.profiles.active=dev
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:mercadoexpress;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# A massa de teste roda depois do Hibernate criar tabela e sequence
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/data-dev.sql
spring.jpa.defer-datasource-initialization=true

# Console web do H2 em http://localhost:8082/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
